name: LaraJailed
options:
  bundleIdPrefix: dev.squally.lara
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  LaraJailedCore:
    path: .

targets:
  LaraJailed:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOSApp
    dependencies:
      - package: LaraJailedCore
        product: LaraJailedCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.squally.lara.jailed
        PRODUCT_NAME: LaraJailed
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lara Jailed
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
