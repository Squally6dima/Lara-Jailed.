name: Build Lara-Jailed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lara-jailed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Swift core tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

  ios-simulator:
    name: Build iOS Simulator app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project LaraJailed.xcodeproj \
            -scheme LaraJailed \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app artifact
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/LaraJailed.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/LaraJailed-iOS-Simulator.zip

      - name: Build for physical iOS device (unsigned)
        run: |
          xcodebuild \
            -project LaraJailed.xcodeproj \
            -scheme LaraJailed \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned device app artifact
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Debug-iphoneos/LaraJailed.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/LaraJailed-iOS-Unsigned.zip

      - name: Upload unsigned device app
        uses: actions/upload-artifact@v4
        with:
          name: LaraJailed-iOS-Unsigned
          path: build/LaraJailed-iOS-Unsigned.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: LaraJailed-iOS-Simulator
          path: build/LaraJailed-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
